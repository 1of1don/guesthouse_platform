server.port=${PORT:5000}

# --- Database (JPA creates/updates the tables automatically - no migrations needed) ---
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/guesthub}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.application.name=micasa-api
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Upload limits: 5MB per image, 30MB per request (logo + 5 gallery images) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB

# --- App settings ---
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiration-ms=${JWT_EXPIRES_MS:604800000}
app.cookie-secure=${COOKIE_SECURE:false}
app.reset-url-base=${RESET_URL_BASE:http://localhost:3000/reset-password}

app.owner.name=${OWNER_NAME:Ontiretse B.}
app.owner.email=${OWNER_EMAIL:ontiretse@biust.ac.bw}
app.owner.password=${OWNER_PASSWORD:OwnerPass123!}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
