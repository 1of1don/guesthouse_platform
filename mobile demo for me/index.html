:root{--font:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif}

/* ===== v7: transition background, Figma warm look, Leaflet map, sheets ===== */
/* Registered colours: lets the browser animate var() colours, so a theme change glides instead of snapping. */
@property --bg1{syntax:'<color>';inherits:true;initial-value:#faf6f0}
@property --bg2{syntax:'<color>';inherits:true;initial-value:#efe3d3}
@property --bg3{syntax:'<color>';inherits:true;initial-value:#e8d9c5}
@property --acc{syntax:'<color>';inherits:true;initial-value:#4a3427}
#app{transition:--bg1 .9s,--bg2 .9s,--bg3 .9s,--acc .6s,color .6s}
/* Aurora: two soft light pools drifting slowly behind everything. Tweak the % to change how strong they are. */
#app::before{content:"";position:absolute;inset:-20%;pointer-events:none;
 background:radial-gradient(55% 42% at 18% 8%,color-mix(in srgb,var(--bg3) 75%,transparent),transparent 70%),
 radial-gradient(48% 38% at 86% 88%,color-mix(in srgb,var(--acc) 38%,transparent),transparent 70%);
 animation:aur 24s ease-in-out infinite alternate}
@keyframes aur{from{transform:translate3d(-3%,-2%,0) scale(1)}to{transform:translate3d(3%,3%,0) scale(1.12)}}
.dk #app::after,#app.dk::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 120%,rgba(0,0,0,.35),transparent 60%)}
@media(prefers-reduced-motion:reduce){#app::before{animation:none}}
/* Figma look: soft tiles, ghost buttons, calm notes */
.tile{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.btn.ghost{background:var(--gl);color:var(--tx);border:1px solid var(--gb)}
.note{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--tx2);margin-top:14px;line-height:1.45}
.sheet-t{font-size:24px;font-weight:700;letter-spacing:-.4px}
.link{text-align:center;margin-top:14px;font-size:14px;font-weight:600;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;text-align:center;font-size:14px;margin:10px 0}
.cal b{font-size:11px;color:var(--tx2);padding-bottom:6px}.cal i{font-style:normal;padding:9px 0;cursor:pointer}
.cal i.in{background:color-mix(in srgb,var(--acc) 18%,transparent)}.cal i.e{background:var(--acc);color:var(--atx);border-radius:99px}
/* Real map (Leaflet + OpenStreetMap). isolate keeps its layers below the nav bar. */
#lm{isolation:isolate;background:var(--bg2)}
.pin{transform:translate(-50%,-100%);background:var(--acc);color:var(--atx);padding:5px 10px;border-radius:99px;font:700 11px/1 system-ui;white-space:nowrap;box-shadow:0 4px 12px var(--sh);border:2px solid #fff}
.dk .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.8) contrast(.9)}
.leaflet-container{font:inherit}
